services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kasirnusa-backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - JEV_API_KEY=${JEV_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env:ro
    networks:
      default:
        aliases:
          - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kasirnusa-frontend
    restart: always
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kasirnusa-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    profiles:
      - tunnel
